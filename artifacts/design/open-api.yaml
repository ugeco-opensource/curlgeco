openapi: 3.1.0
info:
  title: curlgeco Edge API
  version: 0.1.0
  description: >
    App-owned HTTP surface for the curlgeco frontend. Authentication is handled
    externally by Supabase client SDK flows and is therefore not modeled here.
servers:
  - url: http://localhost:3000
  - url: https://curlgeco.ugeco.in
paths:
  /api/health:
    get:
      summary: Health probe
      operationId: getHealth
      responses:
        "200":
          description: Service health payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/chat:
    post:
      summary: Proxy an OpenAI-compatible chat completion request
      operationId: postChatProxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatProxyRequest"
      responses:
        "200":
          description: Non-stream JSON completion or streaming SSE response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
                description: SSE stream emitted by the upstream provider
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Proxy failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - authEnabled
        - authRequired
        - gtmEnabled
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: curlgeco
        authEnabled:
          type: boolean
        authRequired:
          type: boolean
        gtmEnabled:
          type: boolean
    ChatProxyRequest:
      type: object
      required:
        - endpoint
        - model
        - messages
      properties:
        endpoint:
          $ref: "#/components/schemas/EndpointConfig"
        model:
          type: string
          example: Qwen/Qwen2.5-7B-Instruct
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          minimum: 0
          maximum: 2
          example: 0.6
        max_tokens:
          type: integer
          minimum: 1
          example: 200
        top_p:
          type: number
          minimum: 0
          maximum: 1
          example: 1
        stream:
          type: boolean
          example: true
    EndpointConfig:
      type: object
      required:
        - id
        - name
        - provider
        - baseUrl
        - apiKey
        - defaultModel
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
          enum:
            - HF_ROUTER
            - HF_DEDICATED_ENDPOINT
            - OPENAI_COMPATIBLE_GENERIC
        baseUrl:
          type: string
          format: uri
        apiKey:
          type: string
          description: Provider API key supplied by the user workspace
        defaultModel:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
        content:
          type: string
    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
              finish_reason:
                type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
