openapi: 3.1.0
info:
  title: curlgeco Provider Contract
  version: 0.2.0
  description: >
    curlgeco has no backend of its own — it's a static export. This describes
    the OpenAI-compatible `/chat/completions` contract that a configured
    endpoint (Hugging Face router, a dedicated endpoint, or a generic
    OpenAI-compatible provider) must implement, since the browser calls it
    directly. Authentication into curlgeco itself is handled externally by
    the Supabase client SDK and is not modeled here.
servers:
  - url: "{baseUrl}"
    description: The user-configured endpoint base URL (per EndpointConfig)
    variables:
      baseUrl:
        default: https://router.huggingface.co/v1
paths:
  /chat/completions:
    post:
      summary: Chat completion (OpenAI-compatible), called directly from the browser
      operationId: postChatCompletion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Non-stream JSON completion or streaming SSE response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
                description: SSE stream emitted by the provider
        "4XX":
          description: Provider-reported client error (e.g. bad request, auth failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "5XX":
          description: Provider-side failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Sent as `Authorization: Bearer <endpoint.apiKey>` from the browser"
  schemas:
    EndpointConfig:
      type: object
      description: Stored in browser storage; never sent to curlgeco itself, only used locally to build the request below.
      required:
        - id
        - name
        - provider
        - baseUrl
        - apiKey
        - defaultModel
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
          enum:
            - HF_ROUTER
            - HF_DEDICATED_ENDPOINT
            - OPENAI_COMPATIBLE_GENERIC
        baseUrl:
          type: string
          format: uri
        apiKey:
          type: string
          description: Provider API key supplied by the user workspace; sent as a bearer token directly to the provider
        defaultModel:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
        content:
          type: string
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          example: Qwen/Qwen2.5-7B-Instruct
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          minimum: 0
          maximum: 2
          example: 0.6
        max_tokens:
          type: integer
          minimum: 1
          example: 200
        top_p:
          type: number
          minimum: 0
          maximum: 1
          example: 1
        stream:
          type: boolean
          example: true
    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
              finish_reason:
                type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
